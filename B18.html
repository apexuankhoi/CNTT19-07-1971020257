<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài lab 18 - Danh sách thành viên</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eaf4f2;
      --card: #ffffff;
      --ink: #1a1f24;
      --accent: #1f5f7a;
      --accent-2: #3a8f7b;
      --danger: #b84b3d;
      --line: #d9e2e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Sora", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 10%, #d7f0ea, transparent 45%),
        radial-gradient(circle at 90% 0%, #e1ecff, transparent 40%),
        var(--bg);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: min(720px, 94vw);
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 50px rgba(26, 31, 36, 0.14);
      animation: floatUp 520ms ease;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #52606b;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      flex: 1 1 220px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
    }

    .btn {
      border: 0;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }

    .btn.danger {
      background: var(--danger);
    }

    .member-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: grid;
      gap: 10px;
    }

    .member-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      background: #ffffff;
      animation: fadeIn 360ms ease;
    }

    .member-index {
      font-weight: 600;
      color: var(--accent-2);
      min-width: 28px;
    }

    .member-name {
      font-weight: 600;
    }

    .edit-input {
      display: none;
      width: 100%;
    }

    .member-item.is-editing .member-name {
      display: none;
    }

    .member-item.is-editing .edit-input {
      display: block;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .member-item .save-btn,
    .member-item .cancel-btn {
      display: none;
    }

    .member-item.is-editing .save-btn,
    .member-item.is-editing .cancel-btn {
      display: inline-flex;
    }

    .member-item.is-editing .edit-btn {
      display: none;
    }

    .note {
      margin: 16px 0 0;
      color: #52606b;
      font-size: 14px;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .member-item {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .actions {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Bài lab 18 - Danh sách thành viên</h1>
      <p class="subtitle">Thêm, sửa và xóa thành viên bằng jQuery</p>

      <div class="input-row">
        <input id="member-name" type="text" placeholder="Tên thành viên">
        <button id="add-member" class="btn">Thêm thành viên</button>
      </div>

      <ul id="member-list" class="member-list"></ul>

      <p class="note">Tự động đánh số sau mỗi thao tác.</p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function() {
      const $list = $("#member-list");

      function refreshIndexes() {
        $list.children(".member-item").each(function(index) {
          $(this).find(".member-index").text(index + 1 + ".");
        });
      }

      function createMemberItem(name) {
        const $item = $("<li>").addClass("member-item");
        const $index = $("<span>").addClass("member-index").text("1.");
        const $name = $("<span>").addClass("member-name").text(name);
        const $input = $("<input>")
          .addClass("edit-input")
          .attr("type", "text")
          .val(name);

        const $actions = $("<div>").addClass("actions");
        const $edit = $("<button>").addClass("btn ghost edit-btn").text("Sửa");
        const $save = $("<button>").addClass("btn save-btn").text("Lưu");
        const $cancel = $("<button>").addClass("btn ghost cancel-btn").text("Hủy");
        const $delete = $("<button>").addClass("btn danger delete-btn").text("Xóa");

        $actions.append($edit, $save, $cancel, $delete);
        $item.append($index, $name, $input, $actions);

        return $item;
      }

      function addMember(name) {
        const $item = createMemberItem(name).hide();
        $list.append($item);
        $item.slideDown(150);
        refreshIndexes();
      }

      $("#add-member").on("click", function() {
        const name = $("#member-name").val().trim();
        if (!name) {
          return;
        }
        addMember(name);
        $("#member-name").val("").focus();
      });

      $("#member-name").on("keydown", function(event) {
        if (event.key === "Enter") {
          $("#add-member").click();
        }
      });

      $list.on("click", ".edit-btn", function() {
        const $item = $(this).closest(".member-item");
        const $name = $item.find(".member-name");
        const $input = $name.next(".edit-input");
        $input.val($name.text());
        $item.addClass("is-editing");
        $input.focus();
      });

      $list.on("click", ".save-btn", function() {
        const $item = $(this).closest(".member-item");
        const $input = $item.find(".edit-input");
        const $name = $input.prev(".member-name");
        const nextName = $input.val().trim();

        if (!nextName) {
          return;
        }

        $name.text(nextName);
        $item.removeClass("is-editing");
      });

      $list.on("click", ".cancel-btn", function() {
        const $item = $(this).closest(".member-item");
        const $input = $item.find(".edit-input");
        const $name = $input.prev(".member-name");
        $input.val($name.text());
        $item.removeClass("is-editing");
      });

      $list.on("click", ".delete-btn", function() {
        const $item = $(this).closest(".member-item");
        $item.slideUp(150, function() {
          $(this).remove();
          refreshIndexes();
        });
      });

      $list.on("keydown", ".edit-input", function(event) {
        if (event.key === "Enter") {
          $(this).closest(".member-item").find(".save-btn").click();
        }
        if (event.key === "Escape") {
          $(this).closest(".member-item").find(".cancel-btn").click();
        }
      });

      ["Ngọc Anh", "Minh Khoa"].forEach(addMember);
    });
  </script>
</body>
</html>
