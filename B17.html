<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài lab 17 - Giỏ hàng đơn giản</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe8;
      --card: #ffffff;
      --ink: #1c1a17;
      --accent: #d7672c;
      --accent-soft: #f4e1d2;
      --line: #e8dfd7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Fraunces", "Georgia", serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 0%, #d8ecff, transparent 45%),
        radial-gradient(circle at 90% 10%, #ffe7c8, transparent 45%),
        var(--bg);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: min(820px, 94vw);
      background: var(--card);
      border-radius: 26px;
      padding: 28px 30px 32px;
      box-shadow: 0 24px 50px rgba(28, 26, 23, 0.14);
      animation: lift 520ms ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0;
      color: #5f5950;
      font-size: 15px;
    }

    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .cart {
      display: grid;
      gap: 8px;
    }

    .cart-row {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr 1fr 0.9fr;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      align-items: center;
    }

    .cart-row.header {
      font-weight: 600;
      background: #f7f2ec;
      color: #524b43;
      border: 1px solid var(--line);
    }

    .cart-row.item {
      border: 1px solid var(--line);
      background: #ffffff;
      animation: slideIn 520ms ease both;
    }

    .cart-row.item:nth-of-type(2) {
      animation-delay: 80ms;
    }

    .cart-row.item:nth-of-type(3) {
      animation-delay: 160ms;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .product-cell {
      display:flex;
      align-items:center;
      gap:8px;
    }

    .del-product {
      padding:6px 8px;
      border-radius:8px;
      font-size:13px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent) 0%, #e55a14 100%);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(215, 103, 44, 0.25);
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn:hover:not([disabled]) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(215, 103, 44, 0.4);
    }

    .btn:active:not([disabled]) {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(215, 103, 44, 0.2);
    }

    .btn[disabled] {
      opacity: 0.56;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      margin-left: 8px;
      vertical-align: middle;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .qty-btn {
      border: 0;
      background: var(--accent);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    .qty-btn:hover {
      transform: translateY(-2px);
    }

    .qty {
      min-width: 24px;
      text-align: center;
      font-weight: 600;
    }

    .total-bar {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #f8f4ee;
      border-radius: 16px;
      border: 1px solid var(--line);
      font-size: 18px;
    }

    .grand-total {
      color: var(--accent);
      font-weight: 600;
    }

    @keyframes lift {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-14px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media (max-width: 700px) {
      .cart-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .cart-row.header {
        display: none;
      }

      .cart-row.item {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="header">
        <div>
          <h1>Bài lab 17 - Giỏ hàng đơn giản</h1>
          <p class="subtitle">Cập nhật số lượng và tổng tiền bằng jQuery</p>
        </div>
        <span id="item-count" class="pill">0 sản phẩm</span>
      </div>

      <div style="margin-bottom:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <input id="new-name" type="text" placeholder="Tên sản phẩm" style="padding:8px 10px; border-radius:10px; border:1px solid var(--line); width:220px;">
        <input id="new-price" type="number" placeholder="Đơn giá (đ)" style="padding:8px 10px; border-radius:10px; border:1px solid var(--line); width:160px;">
        <button id="add-product" class="btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="btn-label">Thêm sản phẩm</span>
          <span class="spinner" style="display:none"></span>
        </button>
        <span id="form-error" style="color:#b84b3d; font-size:13px; margin-left:6px; display:none;"></span>
      </div>

      <div class="cart">
        <div class="cart-row header">
          <div>Sản phẩm</div>
          <div>Đơn giá</div>
          <div>Số lượng</div>
          <div>Thành tiền</div>
        </div>

        <div class="cart-row item" data-price="120000">
          <div class="product-cell"><span>Sổ tay Campus</span><button class="del-product">Xóa</button></div>
          <div class="price">0</div>
          <div class="qty-controls">
            <button class="qty-btn minus">-</button>
            <span class="qty">1</span>
            <button class="qty-btn plus">+</button>
          </div>
          <div class="line-total">0</div>
        </div>

        <div class="cart-row item" data-price="85000">
          <div class="product-cell"><span>Bộ bút gel</span><button class="del-product">Xóa</button></div>
          <div class="price">0</div>
          <div class="qty-controls">
            <button class="qty-btn minus">-</button>
            <span class="qty">1</span>
            <button class="qty-btn plus">+</button>
          </div>
          <div class="line-total">0</div>
        </div>
      </div>

      <div class="total-bar">
        <span>Tổng cộng</span>
        <span id="grand-total" class="grand-total">0</span>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function() {
      function formatMoney(value) {
        return value.toLocaleString("vi-VN") + " đ";
      }

      function updateRow($row) {
        const price = Number($row.data("price"));
        const qty = Number($row.find(".qty").text());
        $row.find(".price").text(formatMoney(price));
        $row.find(".line-total").text(formatMoney(price * qty));
      }

      function updateTotal() {
        let sum = 0;
        $(".cart-row.item").each(function() {
          const $row = $(this);
          const price = Number($row.data("price"));
          const qty = Number($row.find(".qty").text());
          sum += price * qty;
        });
        $("#grand-total").text(formatMoney(sum));
      }

        function refreshItemCount() {
          $("#item-count").text($(".cart-row.item").length + " sản phẩm");
        }

        function createCartRow(name, price) {
          const safeName = $('<div>').text(name).html();
          const html =
            '<div class="cart-row item" data-price="' + price + '">' +
              '<div class="product-cell"><span>' + safeName + '</span><button class="del-product">Xóa</button></div>' +
              '<div class="price">0</div>' +
              '<div class="qty-controls">' +
                '<button class="qty-btn minus">-</button>' +
                '<span class="qty">1</span>' +
                '<button class="qty-btn plus">+</button>' +
              '</div>' +
              '<div class="line-total">0</div>' +
            '</div>';

          return $(html);
        }

      $(".cart").on("click", ".qty-btn", function() {
        const $row = $(this).closest(".cart-row.item");
        let qty = Number($row.find(".qty").text());

        if ($(this).hasClass("plus")) {
          qty += 1;
        } else {
          qty -= 1;
        }

        if (qty < 1) {
          qty = 1;
        }

        $row.find(".qty").text(qty);
        updateRow($row);
        updateTotal();
      });

      $(".cart-row.item").each(function() {
        updateRow($(this));
      });

      // handle delete product (delegated)
      $(".cart").on("click", ".del-product", function() {
        const $row = $(this).closest('.cart-row.item');
        $row.slideUp(150, function() { $(this).remove(); updateTotal(); refreshItemCount(); });
      });


      // add new product (click or Enter)
      function clearFormError() { $("#form-error").hide().text(''); }

      $("#add-product").on('click', function() {
        clearFormError();
        const name = $("#new-name").val().trim();
        const priceVal = $("#new-price").val();
        const price = Number(priceVal);
        if (!name) { $("#form-error").text('Tên sản phẩm không được trống.').show(); return; }
        if (!priceVal || isNaN(price) || price <= 0) { $("#form-error").text('Đơn giá phải là số lớn hơn 0.').show(); return; }

        const $row = createCartRow(name, price).hide();
        $(".cart").append($row);
        $row.slideDown(180);
        updateRow($row);
        updateTotal();
        refreshItemCount();
        $("#new-name").val('');
        $("#new-price").val('');
        $("#new-name").focus();
      });

      $("#new-name, #new-price").on('keydown', function(e) {
        if (e.key === 'Enter') { $("#add-product").click(); }
      });

      refreshItemCount();
      updateTotal();
    });
  </script>
</body>
</html>
