<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài lab 16 - Bộ đếm tương tác</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6efe4;
      --card: #ffffff;
      --ink: #1d1a16;
      --accent: #1f6f6d;
      --accent-2: #f28c52;
      --positive: #1f7a5f;
      --negative: #b53a2f;
      --zero: #6f6b65;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 10%, #fff3da, transparent 45%),
        radial-gradient(circle at 80% 0%, #e6f2f0, transparent 40%),
        var(--bg);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: min(680px, 92vw);
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(29, 26, 22, 0.12);
      animation: rise 480ms ease;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: #5a554f;
    }

    .counter {
      font-size: 64px;
      font-weight: 600;
      margin: 18px 0;
      padding: 18px 20px;
      border-radius: 16px;
      text-align: center;
      background: #f4f1ec;
      border: 2px solid #efe6da;
      transition: color 200ms ease, border-color 200ms ease;
    }

    .counter.is-positive {
      color: var(--positive);
      border-color: rgba(31, 122, 95, 0.4);
    }

    .counter.is-negative {
      color: var(--negative);
      border-color: rgba(181, 58, 47, 0.4);
    }

    .counter.is-zero {
      color: var(--zero);
      border-color: rgba(111, 107, 101, 0.35);
    }

    .counter.pulse {
      animation: pulse 180ms ease;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      background: var(--accent);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(31, 111, 109, 0.25);
    }

    .btn.ghost {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      box-shadow: none;
    }

    .legend {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #f4f1ec;
    }

    .chip.positive {
      color: var(--positive);
    }

    .chip.negative {
      color: var(--negative);
    }

    .chip.zero {
      color: var(--zero);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Bài lab 16 - Bộ đếm tương tác</h1>
      <p class="subtitle">Sự kiện click jQuery + cập nhật DOM trực tiếp</p>
      <div id="counter" class="counter">0</div>
      <div class="controls">
        <button id="btn-dec" class="btn">-1</button>
        <button id="btn-inc" class="btn">+1</button>
        <button id="btn-inc10" class="btn">+10</button>
        <button id="btn-reset" class="btn ghost">Đặt lại</button>
      </div>
      <div class="legend">
        <span class="chip positive">Dương</span>
        <span class="chip zero">Bằng 0</span>
        <span class="chip negative">Âm</span>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function() {
      let count = 0;

      function updateView() {
        const $display = $("#counter");
        $display.text(count);
        $display.removeClass("is-positive is-negative is-zero");

        if (count > 0) {
          $display.addClass("is-positive");
        } else if (count < 0) {
          $display.addClass("is-negative");
        } else {
          $display.addClass("is-zero");
        }

        $display.addClass("pulse");
        setTimeout(() => $display.removeClass("pulse"), 160);
      }

      $("#btn-inc").on("click", function() {
        count += 1;
        updateView();
      });

      $("#btn-dec").on("click", function() {
        count -= 1;
        updateView();
      });

      $("#btn-inc10").on("click", function() {
        count += 10;
        updateView();
      });

      $("#btn-reset").on("click", function() {
        count = 0;
        updateView();
      });

      updateView();
    });
  </script>
</body>
</html>
